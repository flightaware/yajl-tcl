name: Mac CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        brew update
        brew install tcl-tk@8
        brew install yajl
        brew install autoconf
    - name: configure	
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@8
        ./configure --with-tcl=$PREFIX/lib --prefix=/usr/local
    - name: make
      run: make
    - name: install
      run: sudo make install
    - name: test
      run: make test

