name: Mac Tcl8 Build Install

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew install autoconf
        brew reinstall tcl-tk@8
        brew install yajl
    - name: configure
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@8
        echo @DEBUG@ ls $PREFIX $PREFIX/lib
        ls $PREFIX $PREFIX/lib
        echo @DEBUG@ file $PREFIX/lib/*.dylib $PREFIX/lib/*stub*
        file $PREFIX/lib/*.dylib $PREFIX/lib/*stub*
        echo @DEBUG@ cat $PREFIX/lib/tclConfig.sh
        cat $PREFIX/lib/tclConfig.sh
        export LDFLAGS=-L$PREFIX/lib
        export CPPFLAGS=-I$PREFIX/include
        ./configure --with-tcl=$PREFIX/lib --prefix=/usr/local
    - name: make
      run: make
    - name: install
      run: sudo make install
    - name: test
      run: make test

