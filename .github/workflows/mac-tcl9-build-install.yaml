name: Mac Tcl9 Build Install

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew install autoconf
        brew install tcl-tk@9
        brew install yajl
    - name: configure
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@9
        echo "@DEBUG find $PREFIX/. -name init.tcl"
        find $PREFIX/. -name init.tcl
        echo "@DEBUG find /opt/homebrew -name init.tcl"
        find /opt/homebrew -name init.tcl
        VER="`ls $PREFIX/lib | sed -n '/libtcl\(9\.[0-9]*\)\.dylib/s//\1/p'`"
        echo "@DEBUG VER=$VER"
        export LDFLAGS=-L$PREFIX/lib
        export LIBS=-ltcl$VER
        export CPPFLAGS=-I$PREFIX/include
        ./configure --with-tcl=$PREFIX/lib --prefix=/usr/local || (cat config.log; false)
        sed -I "" 's%TCL_LIBRARY=`.*`'"%TCL_LIBRARY='$PREFIX/lib/tcl$VER'%" Makefile
        echo "@DEBUG@ grep TCL_LIBRARY Makefile"
        grep TCL_LIBRARY Makefile
    - name: make
      run: make
    - name: install
      run: sudo make install
    - name: test
      run: |
        echo "@DEBUG find /private/tmp -name tcl9.1.0"
        find /private/tmp -name tcl9.1.0
        make test

